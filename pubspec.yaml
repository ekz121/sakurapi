name: sakurapi
description: Pencatat keuangan lokal dan pemindai struk untuk tugas Pemrograman Mobile.
publish_to: none
version: 1.1.1+3
environment:
  sdk: '>=3.8.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  material_ui: ^1.1.0
  sqflite: ^2.4.2
  sqflite_common_ffi_web: ^1.2.2
  path: ^1.9.1
  path_provider: ^2.1.5
  image_picker: ^1.2.1
  google_mlkit_text_recognition: ^0.15.0
  intl: ^0.20.2
dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.3.6
flutter:
  uses-material-design: true
